server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  # Las llamadas a la API se redirigen al contenedor del backend.
  location /api/ {
    proxy_pass http://api:8000;
  }

  # Rutas de React Router: siempre se devuelve index.html.
  location / {
    try_files $uri /index.html;
  }
}
