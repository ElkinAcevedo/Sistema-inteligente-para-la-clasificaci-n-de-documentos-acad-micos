name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    name: Backend y ML (lint + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Crear entorno e instalar dependencias
        run: |
          uv venv --python 3.12
          uv pip install -e "ml[dev]" -e "backend[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check backend ml

      - name: Pruebas del paquete ML
        run: pytest ml/tests

      - name: Pruebas del backend
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint + pruebas + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
